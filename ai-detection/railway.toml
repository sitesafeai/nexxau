[build]
builder = "dockerfile"
dockerfilePath = "ai-detection/Dockerfile"

[deploy]
startCommand = "python railway_service.py"
restartPolicyType = "always"

# === REQUIRED ENV VARS ON RAILWAY ===
# Set these in the Railway dashboard for the ai-detection service.
#
# BACKEND_URL            = https://<your-nextjs-app-railway-domain>
#                          (NOT localhost — this service calls your Next.js app over the network)
# INTERNAL_SERVICE_TOKEN = <same token as in the Next.js service>
# YOLO_MODEL             = yolov8n.pt   (default, downloads automatically on first start)
# YOLO_CONFIDENCE        = 0.5          (optional, default 0.5)
# CAMERA_POLL_SEC        = 60           (optional, how often to re-fetch camera list)
# FRAME_SKIP             = 5            (optional, run inference every N frames)
# VIOLATION_COOLDOWN_SEC = 30           (optional, seconds between repeat violation alerts)
