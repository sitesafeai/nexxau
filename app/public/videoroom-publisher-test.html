<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Janus VideoRoom Test - Publisher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        h1 {
            color: #4CAF50;
        }
        #status {
            padding: 10px;
            margin: 10px 0;
            background: #2a2a2a;
            border-radius: 4px;
            font-family: monospace;
        }
        #status.error {
            background: #4a1a1a;
            color: #ff6b6b;
        }
        #status.success {
            background: #1a4a1a;
            color: #6bff6b;
        }
        #video-container {
            margin: 20px 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #local-video {
            width: 100%;
            max-width: 1280px;
            height: auto;
            background: #000;
        }
        #video-container:empty::before {
            content: "Waiting for webcam access...";
            color: #666;
            font-size: 18px;
        }
        #console-log {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .log-entry {
            margin: 2px 0;
        }
        .log-error {
            color: #f00;
        }
        .log-success {
            color: #0f0;
        }
        .log-info {
            color: #0ff;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Janus VideoRoom Test - Publisher</h1>
    
    <div id="status">Initializing...</div>
    
    <div>
        <button id="start-btn" onclick="window.janusPublisherTest?.startPublishing()">Start Publishing</button>
        <button id="stop-btn" onclick="window.janusPublisherTest?.stopPublishing()" disabled>Stop Publishing</button>
    </div>
    
    <div id="video-container">
        <video id="local-video" autoplay playsinline></video>
    </div>
    
    <h2>Console Log</h2>
    <div id="console-log"></div>

    <!-- Load WebRTC adapter first -->
    <script src="/libs/adapter.min.js"></script>
    <!-- Load Janus library -->
    <script src="/libs/janus.js"></script>
    <!-- Load our test script -->
    <script src="/videoroom-publisher-test.js"></script>
</body>
</html>
