services:
  frontend:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - mediamtx
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # MediaMTX — use docker service hostname, NOT localhost
      - MEDIAMTX_API_URL=http://mediamtx:9000
      - MEDIAMTX_HLS_ORIGIN=http://mediamtx:8888
      - MEDIAMTX_API_USERNAME=${MEDIAMTX_USER}
      - MEDIAMTX_API_PASSWORD=${MEDIAMTX_PASS}

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./prisma:/app/prisma
      - ./backend:/app
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
    depends_on:
      - mediamtx
      - yolo

  yolo:
    build:
      context: ./ai-detection
    ports:
      - "5000:5000"
    depends_on:
      - frontend
    environment:
      - PYTHONUNBUFFERED=1
      # Point at the Next.js app inside Docker network, NOT localhost
      - BACKEND_URL=http://frontend:3000
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC
      - "9000:9000"   # API
      - "9001:9001"   # Metrics
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    environment:
      - MTX_AUTHINTERNALUSERS_0_USER=${MEDIAMTX_USER}
      - MTX_AUTHINTERNALUSERS_0_PASS=${MEDIAMTX_PASS}

networks:
  default:
    driver: bridge
