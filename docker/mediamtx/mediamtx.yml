# MediaMTX Configuration
logLevel: info
logDestinations: [stdout]
logFile: ""

# API server
api: yes
apiAddress: :9000

# Metrics
metrics: yes
metricsAddress: :9001

# RTSP server
rtspAddress: :8554

# HLS server
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: mpegts
hlsSegmentCount: 6
hlsSegmentDuration: 2s
hlsSegmentMaxSize: 50M
hlsAllowOrigin: "*"

pathDefaults:
  # Notify the Nexxau app when any stream connects or disconnects
  # Requires NEXXAU_APP_URL and INTERNAL_SERVICE_TOKEN env vars on this service
  runOnReady: >-
    curl -sf -X POST "${NEXXAU_APP_URL}/api/cameras/stream-event"
    -H "Content-Type: application/json"
    -H "Authorization: Bearer ${INTERNAL_SERVICE_TOKEN}"
    -d "{\"path\":\"$MTX_PATH\",\"event\":\"connected\"}" || true
  runOnNotReady: >-
    curl -sf -X POST "${NEXXAU_APP_URL}/api/cameras/stream-event"
    -H "Content-Type: application/json"
    -H "Authorization: Bearer ${INTERNAL_SERVICE_TOKEN}"
    -d "{\"path\":\"$MTX_PATH\",\"event\":\"disconnected\"}" || true

paths:
  all_others:
    source: publisher

# Authentication
authMethod: "internal"
authInternalUsers:
  - user: "admin"
    pass: "nexxau"
    ips: []
    permissions:
      - action: read
      - action: publish
      - action: playback
      - action: api
