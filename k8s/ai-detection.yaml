apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-detection
  namespace: nexxau
  labels:
    app: ai-detection
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-detection
  template:
    metadata:
      labels:
        app: ai-detection
    spec:
      containers:
      - name: ai-detection
        image: nexxau/ai-detection:latest
        ports:
        - containerPort: 8000
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: WEB_APP_URL
          value: "http://app:3000"
        - name: MODEL_PATH
          value: "/app/models/yolov8n.pt"
        volumeMounts:
        - name: ai-models
          mountPath: /app/models
        - name: ai-logs
          mountPath: /app/logs
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
            nvidia.com/gpu: 1
          limits:
            memory: "4Gi"
            cpu: "2000m"
            nvidia.com/gpu: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: ai-models
        persistentVolumeClaim:
          claimName: ai-models-pvc
      - name: ai-logs
        persistentVolumeClaim:
          claimName: ai-logs-pvc
      nodeSelector:
        accelerator: nvidia-tesla-k80
---
apiVersion: v1
kind: Service
metadata:
  name: ai-detection
  namespace: nexxau
  labels:
    app: ai-detection
spec:
  selector:
    app: ai-detection
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-models-pvc
  namespace: nexxau
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: gp2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-logs-pvc
  namespace: nexxau
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: gp2
