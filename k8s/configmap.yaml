apiVersion: v1
kind: ConfigMap
metadata:
  name: nexxau-config
  namespace: nexxau
data:
  NODE_ENV: "production"
  DATABASE_URL: "postgresql://nexxau_user:${POSTGRES_PASSWORD}@postgres:5432/nexxau_production"
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
  NEXTAUTH_URL: "${NEXTAUTH_URL}"
  MEDIAMTX_URL: "http://mediamtx:8888"
  AI_DETECTION_URL: "http://ai-detection:8000"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "${CORS_ORIGIN}"
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_WINDOW: "900000"
  CACHE_TTL: "3600"
  ENABLE_COMPRESSION: "true"
  ENABLE_CACHING: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: nexxau
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "alert_rules.yml"

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093

    scrape_configs:
      - job_name: 'nexxau-app'
        static_configs:
          - targets: ['app:3000']
        metrics_path: '/api/metrics'
        scrape_interval: 15s
        scrape_timeout: 10s

      - job_name: 'ai-detection'
        static_configs:
          - targets: ['ai-detection:8000']
        metrics_path: '/metrics'
        scrape_interval: 15s
        scrape_timeout: 10s

      - job_name: 'mediamtx'
        static_configs:
          - targets: ['mediamtx:8889']
        metrics_path: '/metrics'
        scrape_interval: 15s
        scrape_timeout: 10s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: nexxau
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
