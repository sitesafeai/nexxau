# MediaMTX Configuration
logLevel: info
logDestinations: [stdout]
logFile: ""

# API server
api: yes
apiAddress: :9000

# Metrics
metrics: yes
metricsAddress: :9001

# RTSP server
rtspAddress: :8554

# HLS server
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: mpegts
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsSegmentMaxSize: 50M
hlsAllowOrigin: "*"

paths: {}

# Authentication
authMethod: "internal"
authInternalUsers:
  - user: "${MEDIAMTX_USER}"
    pass: "${MEDIAMTX_PASS}"
    ips: []
    permissions:
      - action: read
      - action: publish
      - action: playback
      - action: api
