# MediaMTX Configuration for Nexxau
# This file is managed by the Nexxau application

# API configuration
api: yes
apiAddress: :9000

# Metrics configuration
metrics: yes
metricsAddress: :9001

# HLS configuration
hls: yes
hlsAddress: :8888
hlsAllowOrigin: "*"
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

# RTSP configuration
rtsp: yes
rtspAddress: :8554

# WebRTC configuration  
webrtc: yes
webrtcAddress: :9002
webrtcAllowOrigin: "*"

# Paths configuration - cameras will be added here dynamically
