# MediaMTX Configuration
# This file configures the MediaMTX streaming server for RTSP to HLS conversion

# Logging
logLevel: info
logDestinations: [stdout]
logFile: ""

# API server (for management)
api: yes
apiAddress: :9000

# Metrics
metrics: yes
metricsAddress: :9001

# RTSP server
rtspAddress: :8554

# HLS server
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsSegmentMaxSize: 50M
hlsAllowOrigin: "*"

# Paths configuration
# Each camera stream will be added dynamically via the API
paths:
  # Example path (can be removed if not needed)
  # camera-1:
  #   source: rtsp://your-rtsp-source-url
  #   sourceOnDemand: yes
  #   sourceOnDemandStartTimeout: 10s
  #   sourceOnDemandCloseAfter: 10s
  #   hls: yes
  #   hlsVariant: lowLatency

